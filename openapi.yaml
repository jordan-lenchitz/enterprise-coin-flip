openapi: 3.0.3
info:
  title: enterprise quantum coin flip service
  description: secure, authenticated b2b solution for true quantum bit collapse.
  version: 1.1.0
servers:
  - url: http://localhost:8080
    description: local server
paths:
  /:
    get:
      summary: get the ui dashboard
      description: returns an interactive html dashboard that reports physical qubit reservation status and cryogenic temperature lock status.
      responses:
        '200':
          description: html dashboard
          content:
            text/html:
              schema:
                type: string
  /flip:
    post:
      summary: flip a quantum coin
      description: authenticated endpoint that collapses the wave function of a single qubit using a physical hadamard gate or falls back to local simulation when no ionq api token is provided.
      security:
        - bearerAuth: []
        - basicAuth: []
      responses:
        '200':
          description: successful wave function collapse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlipResponse'
        '401':
          description: unauthorized (missing or invalid OIDC JWT / Basic credentials)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: forbidden by Hybrid RBAC/ABAC policy or SCIM Leaver revocation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: hardware/simulator error
  /flip/batch:
    post:
      summary: batch flip quantum coins
      description: authenticated endpoint that evaluates RBAC/ABAC batch shot quotas and submits a batch of quantum flips asynchronously.
      security:
        - bearerAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '202':
          description: batch queued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: invalid request (e.g., count not between 1 and 1000)
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /metrics:
    get:
      summary: get prometheus metrics
      description: returns prometheus text-format telemetry counters for flip requests, successes by environment, and simulator fallback runs.
      responses:
        '200':
          description: prometheus metrics payload
          content:
            text/plain:
              schema:
                type: string
  /healthz:
    get:
      summary: liveness probe
      description: lightweight process liveness check that verifies the http server and event loop are responsive without querying external dependencies.
      responses:
        '200':
          description: process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: alive
  /readyz:
    get:
      summary: readiness probe
      description: deep readiness check that verifies active database pool connectivity (select 1) within a 2-second timeout before routing traffic.
      responses:
        '200':
          description: service and database pool are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
        '503':
          description: database unreachable or timed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready
                  database:
                    type: string
                    example: unreachable
  /oauth2/token:
    post:
      summary: issue demo OIDC access token
      description: issues a signed OIDC Bearer JWT for Okta Workforce ('executive', 'analyst', 'scim_admin') or Auth0 B2B CIAM ('b2b_partner') personas.
      responses:
        '200':
          description: signed OIDC Bearer token and claims
  /scim/v2/Users:
    get:
      summary: list SCIM 2.0 users
      description: returns RFC 7644 SCIM 2.0 ListResponse of provisioned accounts, supporting userName eq filter.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: SCIM 2.0 ListResponse
    post:
      summary: provision Joiner via SCIM 2.0
      description: provisions or updates an enterprise account from Workday/Okta Lifecycle Management and logs a SCIM_JOINER_PROVISIONED audit event.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: SCIM 2.0 User created
  /scim/v2/Users/{id}:
    patch:
      summary: update Mover or Leaver via SCIM 2.0 PatchOp
      description: applies SCIM 2.0 PatchOp transitions for Mover department/role/costCenter changes or Leaver active=false soft-deprovisioning.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: updated SCIM 2.0 User
    delete:
      summary: soft-deprovision Leaver via SCIM 2.0
      description: marks account active=false, revokes in-flight OIDC tokens immediately, and preserves SOC 2 ledger history.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: soft-deprovisioned
  /governance/access-review:
    get:
      summary: Okta Identity Governance (OIG) access review report
      description: returns all accounts, RBAC/ABAC entitlements, cumulative QPU ledger spend, SoD compliance findings, and recent JML audit logs.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OIG access review report
  /governance/certify:
    post:
      summary: submit OIG access certification decision
      description: records an APPROVE or REVOKE decision for an account and automatically strips QPU entitlements on REVOKE.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: certification recorded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC Bearer JWT issued by Okta Workforce, Auth0 B2B CIAM, or /oauth2/token, or SCIM provisioning bearer token.
    basicAuth:
      type: http
      scheme: basic
      description: enterprise break-glass credentials required. password must match the 35-iteration sha257 hashed password stored in the database.
  schemas:
    FlipResponse:
      type: object
      required:
        - status
        - result
        - quantum_bit
        - metadata
      properties:
        status:
          type: string
          example: success
        result:
          type: string
          enum: [HEADS, TAILS]
        quantum_bit:
          type: integer
          enum: [0, 1]
        metadata:
          $ref: '#/components/schemas/Metadata'
    Metadata:
      type: object
      required:
        - qubit_type
        - gate
        - environment
      properties:
        qubit_type:
          type: string
          example: ionq aria physical trapped-ion
        gate:
          type: string
          example: hadamard (h)
        environment:
          type: string
          example: ionq aria physical qpu ($12.42 flat fee)
    BatchRequest:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 1000
          example: 100
    BatchResponse:
      type: object
      required:
        - status
        - message
        - webhook_target
      properties:
        status:
          type: string
          example: accepted
        message:
          type: string
          example: batch quantum flip for 100 wave functions queued.
        webhook_target:
          type: string
          example: http://example.com/webhook
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: incorrect enterprise credentials
